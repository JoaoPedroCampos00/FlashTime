{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashTime — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #0A0A0A;
            color: #F5F3EE;
            font-family: 'Jost', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 42px;
            font-weight: 300;
            letter-spacing: -0.01em;
            color: #F5F3EE;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 8px;
        }

        .logo .dash {
            display: inline-block;
            width: 36px;
            height: 1px;
            background: #C9A84C;
            margin-bottom: 4px;
        }

        .tagline {
            font-size: 11px;
            letter-spacing: 0.4em;
            color: #C9A84C;
            text-transform: uppercase;
            margin-bottom: 48px;
            text-align: center;
        }

        .card {
            background: #141414;
            border: 0.5px solid rgba(201, 168, 76, 0.2);
            border-radius: 12px;
            padding: 40px 44px;
            width: 100%;
            max-width: 400px;
        }

        .card-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            font-weight: 400;
            color: #F5F3EE;
            margin-bottom: 28px;
            text-align: center;
        }

        /* Botão de login principal (visível antes do form) */
        .btn-login-hero {
            display: block;
            width: 100%;
            padding: 14px;
            background: #C9A84C;
            color: #0A0A0A;
            border: none;
            border-radius: 6px;
            font-family: 'Jost', sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            margin-bottom: 28px;
            transition: background 0.2s, transform 0.1s;
            text-align: center;
        }

        .btn-login-hero:hover {
            background: #E8C97A;
        }

        .btn-login-hero:active {
            transform: scale(0.99);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 0.5px;
            background: rgba(201, 168, 76, 0.2);
        }

        .divider span {
            font-size: 11px;
            color: #888880;
            letter-spacing: 0.15em;
        }

        /* Campos do Django form */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #C9A84C;
            margin-bottom: 8px;
        }

        /* Estiliza os inputs gerados pelo Django {{ form.as_p }} */
        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 12px 14px;
            background: #1A1A1A;
            border: 0.5px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: #F5F3EE;
            font-family: 'Jost', sans-serif;
            font-size: 14px;
            font-weight: 300;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus {
            border-color: rgba(201, 168, 76, 0.5);
        }

        /* Estilo para o form.as_p padrão do Django */
        form p {
            margin-bottom: 16px;
        }

        form p label {
            display: block;
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #C9A84C;
            margin-bottom: 8px;
        }

        /* Botão de submit do form */
        .btn-submit {
            display: block;
            width: 100%;
            padding: 13px;
            background: transparent;
            color: #F5F3EE;
            border: 0.5px solid rgba(201, 168, 76, 0.4);
            border-radius: 6px;
            font-family: 'Jost', sans-serif;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 8px;
            transition: border-color 0.2s, color 0.2s;
        }

        .btn-submit:hover {
            border-color: #C9A84C;
            color: #C9A84C;
        }

        .footer-note {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #444;
        }

        .footer-note a {
            color: #C9A84C;
            text-decoration: none;
        }

        .footer-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="logo">
        FlashTime <span class="dash"></span>
    </div>
    <p class="tagline">Acesse sua conta</p>

    <div class="card">
        <h2 class="card-title">Entrar</h2>

        <!-- BOTÃO DE LOGIN visível antes do formulário -->
        <button type="button" class="btn-login-hero" onclick="document.getElementById('login-form').scrollIntoView({behavior:'smooth'})">
            → Fazer Login
        </button>

        <div class="divider"><span>ou preencha abaixo</span></div>

        <!-- FORMULÁRIO DJANGO -->
        <form id="login-form" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-submit">Confirmar acesso</button>
        </form>

        <p class="footer-note">
            Problemas? <a href="/admin/">Acessar painel admin</a>
        </p>
    </div>

</body>
</html>
